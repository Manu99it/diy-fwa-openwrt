# ==============================================================================
# Configurazione Esempio: DNS-over-HTTPS (DoH) in OpenWrt
# ==============================================================================
# In OpenWrt, l'implementazione del DoH si ottiene solitamente accoppiando il 
# pacchetto 'https-dns-proxy' (che agisce da proxy DoH locale su porta 5053) 
# con 'dnsmasq' (il server DNS di default che ascolta sulla porta 53 della LAN).
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Configurazione del Proxy DoH: /etc/config/https-dns-proxy
# ------------------------------------------------------------------------------
package https-dns-proxy

# Definizione del primo resolver (Cloudflare DNS sicuro)
config https-dns-proxy 'cloudflare'
	# Indirizzo IP su cui il proxy DoH locale risponde (localhost)
	option listen_addr '127.0.0.1'
	
	# Porta locale su cui il proxy DoH ascolta (es. 5053)
	option listen_port '5053'
	
	# URL del resolver DoH sicuro (utilizza HTTPS per crittografare le richieste)
	option resolver_url 'https://cloudflare-dns.com/dns-query'
	
	# Server DNS usati per risolvere l'indirizzo IP del resolver URL all'avvio 
	# (bootstrap DNS, necessario prima che il tunnel DoH sia attivo)
	option bootstrap_dns '1.1.1.1,1.0.0.1'
	
	# Utente e gruppo di sistema con privilegi ridotti per far girare il processo (security hardening)
	option user 'nobody'
	option group 'nogroup'

# Definizione di un resolver secondario di backup (Quad9 con protezione malware)
config https-dns-proxy 'quad9'
	option listen_addr '127.0.0.1'
	option listen_port '5054'
	option resolver_url 'https://dns.quad9.net/dns-query'
	option bootstrap_dns '9.9.9.9,149.112.112.112'
	option user 'nobody'
	option group 'nogroup'


# ------------------------------------------------------------------------------
# 2. Re-indirizzamento del Traffico DNSmasq: /etc/config/dhcp (Sezione dnsmasq)
# ------------------------------------------------------------------------------
# Per fare in modo che tutta la rete utilizzi il proxy DoH, dobbiamo configurare
# dnsmasq per inoltrare le query ai nostri proxy locali invece che ai DNS del provider cellulare.
# ------------------------------------------------------------------------------

# Estratto del file /etc/config/dhcp
# (config dnsmasq contiene le opzioni globali del resolver)

# config dnsmasq
#	# Forza l'uso esclusivo dei server DNS dichiarati sotto, ignorando i DNS
#	# forniti automaticamente dalla connessione WAN 5G/LTE del provider
#	option noresolv '1'
#
#	# Rifiuta di inoltrare richieste per nomi di dominio locali non qualificati
#	option localise_queries '1'
#
#	# Associa dnsmasq ai proxy DoH locali configurati sopra
#	list server '127.0.0.1#5053'  # Cloudflare DoH
#	list server '127.0.0.1#5054'  # Quad9 DoH (failover)
#
#	# Forza il router a usare se stesso come resolver DNS locale
#	option localuse '1'
