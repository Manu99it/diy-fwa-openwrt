# ==============================================================================
# Configurazione Esempio: /etc/config/usteer
# ==============================================================================
# File di configurazione di OpenWrt per il demone usteer (micro-steering).
# Questo demone coordina i diversi nodi della rete Wi-Fi tramite socket UDP 
# per facilitare il roaming ottimale dei client tra 2.4GHz e 5GHz e tra i 
# diversi piani dell'edificio.
# ==============================================================================

config usteer 'global'
	# Abilita/Disabilita il demone usteer
	option enabled '1'
	
	# Livello di debug (0 = disabilitato, 1 = normale, 2 = verbose)
	# Utile impostarlo a 1 in fase di tuning per monitorare le transizioni in logread
	option debug '0'

	# Interfaccia di rete locale su cui i demoni usteer dei vari AP comunicano
	option network 'lan'

	# Porta UDP utilizzata per la sincronizzazione multicast tra AP (default: 16720)
	option port '16720'

	# ==========================================================================
	# 📶 Parametri di Monitoraggio Segnale (RSSI)
	# ==========================================================================

	# Soglia RSSI (in dBm) sotto la quale usteer inizia a valutare il roaming del client.
	# Se il client ha un segnale migliore di -75 dBm, usteer non interviene.
	option roam_threshold '-75'

	# Differenza minima di segnale (in dB) tra l'AP corrente e un AP alternativo.
	# Il client verrà rediretto solo se l'AP di destinazione ha un segnale migliore di 10 dB.
	option signal_diff_threshold '10'

	# Soglia RSSI sotto la quale l'AP esegue un "kick" immediato (disassocia il client).
	# Usata per i client eccessivamente appiccicosi in condizioni di segnale pessimo.
	option local_kick_threshold '-82'

	# ==========================================================================
	# 🔄 Band Steering (Spostamento Client da 2.4GHz a 5GHz)
	# ==========================================================================

	# Soglia RSSI per forzare i client compatibili sulla banda a 5 GHz.
	# Se il segnale 5GHz è superiore a -70 dBm, l'AP rifiuterà le richieste di associazione 
	# del client sulla frequenza 2.4 GHz, spingendolo sulla più performante 5 GHz.
	option band_steering_threshold '-70'

	# Numero massimo di volte consecutivo in cui rifiutiamo la connessione 2.4GHz di un client 
	# prima di arrenderci e permettergli di connettersi comunque (evita il blocco totale di client ostinati)
	option band_steering_retry_limit '5'

	# ==========================================================================
	# ⏱️ Timer e Intervalli (in millisecondi)
	# ==========================================================================

	# Frequenza di aggiornamento e sincronizzazione del database dei client tra i vari AP
	option update_interval '3000'

	# Tempo (in ms) durante il quale un AP alternativo tiene in memoria un report di segnale
	# per un determinato client prima di considerarlo scaduto
	option host_info_expiry '10000'

	# Tempo di interdizione (in ms) per il quale un AP a cui il client tenta di connettersi
	# ignora le richieste di associazione (usato per forzare la scansione verso l'AP preferito)
	option assoc_delay '2000'

	# ==========================================================================
	# 🛡️ Limitazione del Carico (Load Balancing)
	# ==========================================================================

	# Se abilitato, evita che troppi client si colleghino a un singolo AP se sono presenti 
	# altri AP scarichi nelle vicinanze, bilanciando il carico computazionale e radio.
	option load_balancing_enabled '1'
	
	# Numero massimo di client associabili prima che l'AP venga considerato saturo
	option max_clients '40'
