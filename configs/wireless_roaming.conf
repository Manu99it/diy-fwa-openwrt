# ==============================================================================
# Configurazione Esempio: /etc/config/wireless (Sezione Interfaccia)
# ==============================================================================
# Frammento di configurazione OpenWrt che illustra l'attivazione dei protocolli
# 802.11k, 802.11v e 802.11r (Fast Transition) su un'interfaccia Wi-Fi fisica.
# Questa configurazione deve essere replicata su tutti gli AP con lo stesso SSID.
# ==============================================================================

# Definizione del controller radio hardware (es. 5GHz ac/ax)
config wifi-device 'radio0'
	option type 'mac80211'
	option channel '52'            # Canale DFS ad alta potenza
	option hwmode '11a'
	option htmode 'VHT80'          # Ampiezza di banda 80MHz per alte prestazioni
	option country 'IT'            # Regolamentazione europea EIRP/DFS

# Definizione dell'interfaccia di rete virtuale (SSID)
config wifi-iface 'default_radio0'
	option device 'radio0'
	option network 'lan'
	option mode 'ap'
	option ssid 'FWA_Home_Infranet'
	option encryption 'psk2+ccmp'  # WPA2-PSK (compatibilità massima con 802.11r)
	option key 'UnaPasswordMoltoSicura'

	# ==========================================================================
	# 🌐 802.11k - Neighbor Reports (Misure Risorse Radio)
	# ==========================================================================
	
	# Abilita lo standard 802.11k. Permette ai client di richiedere una lista 
	# di AP vicini per velocizzare la scansione radio durante lo spostamento.
	option ieee80211k '1'

	# ==========================================================================
	# 🔄 802.11v - Wireless Network Management (BSS Transition)
	# ==========================================================================
	
	# Abilita lo standard 802.11v. Consente all'AP di inviare comandi di gestione
	# al client, incluse le richieste di transizione BSS per il roaming forzato.
	option ieee80211v '1'
	
	# Consente il monitoraggio e la gestione del sonno dei dispositivi IoT (risparmio energetico)
	option wnm_sleep_mode '1'
	
	# Consente all'AP di rispondere alle query di transizione BSS inviate dai client
	option bss_transition '1'

	# ==========================================================================
	# ⚡ 802.11r - Fast BSS Transition (FT)
	# ==========================================================================
	
	# Abilita lo standard 802.11r. Riduce il tempo di handshake a < 10ms
	option ieee80211r '1'

	# Identificatore del dominio di mobilità (4 caratteri esadecimali). 
	# Deve essere IDENTICO su tutti gli AP della casa per permettere la transizione rapida.
	option mobility_domain 'cafe'

	# Abilita la generazione locale delle chiavi di crittografia (PMK-R0 e PMK-R1).
	# Semplifica la gestione eliminando la necessità di un server RADIUS esterno (FT-PSK).
	option ft_psk_generate_local '1'

	# Specifica se l'handshake FT deve avvenire via etere (Over-the-Air) o via LAN (Over-the-DS).
	# Over-the-Air ('0') è generalmente più veloce ed è la scelta raccomandata per la stabilità
	# dei dispositivi consumer (iOS / Android).
	option ft_over_ds '0'

	# Network Access Server Identifier (NAS-ID).
	# Deve essere UNICO per ciascun AP. Di solito si usa l'indirizzo MAC senza due punti
	# o l'hostname del router (es. 'AP_Piano_Terra', 'AP_Piano_Uno').
	option nasid 'AP_PIANO_UNO'
